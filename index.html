    <style>

<audio id="audioFondo" loop preload="auto">
    <source id="fuenteAudio" src="" type="audio/mpeg">
</audio>

<script>
// ============================================================
//  CONFIGURACIÓN
// ============================================================
const API_BASE = 'https://api.midvash.com/v1';
const VERSION  = 'rvr1960';

const selectorLibro     = document.getElementById('selectorLibro');
const selectorMusica    = document.getElementById('selectorMusica');
const inputCapitulo     = document.getElementById('capitulo');
const inputVersiculo    = document.getElementById('versiculo');
const btnConsultar      = document.getElementById('btnConsultar');
const btnSonido         = document.getElementById('btnSonido');
const btnCopiar         = document.getElementById('btnCopiar');
const resultadoDiv      = document.getElementById('resultado');
const referenciaDiv     = document.getElementById('referencia');
const textoVersiculoDiv = document.getElementById('textoVersiculo');
const historialLista    = document.getElementById('historialLista');
const audioFondo        = document.getElementById('audioFondo');
const fuenteAudio       = document.getElementById('fuenteAudio');

let sonidoActivo = true;
let versiculoActual = null;
let historial = [];
let modoMusica = 'celestial';

// ============================================================
//  MOTOR DE MÚSICA PROCEDURAL (Web Audio API)
// ============================================================
const MusicEngine = (() => {
    let ctx = null;
    let masterGain = null;
    let reverbGain = null;
    let isPlaying = false;
    let currentProgression = null;
    let loopTimer = null;
    let activeOscillators = [];

    const PROGRESIONES = {
        celestial: {
            chords: [
                [261.63, 329.63, 392.00, 523.25],
                [220.00, 261.63, 329.63, 440.00],
                [174.61, 220.00, 261.63, 349.23],
                [196.00, 246.94, 293.66, 392.00]
            ],
            melody: [
                523.25, 587.33, 659.25, 783.99, 659.25, 587.33,
                523.25, 440.00, 523.25, 659.25, 587.33, 523.25,
                440.00, 392.00, 440.00, 523.25, 587.33, 523.25,
                392.00, 440.00, 493.88, 523.25, 587.33, 523.25
            ],
            tempo: 4.0,
            waveform: 'sine',
            melodyWave: 'triangle'
        },
        alegre: {
            chords: [
                [174.61, 220.00, 261.63, 349.23],
                [261.63, 329.63, 392.00, 523.25],
                [196.00, 246.94, 293.66, 392.00],
                [220.00, 261.63, 329.63, 440.00]
            ],
            melody: [
                698.46, 659.25, 587.33, 523.25, 587.33, 659.25,
                783.99, 698.46, 659.25, 587.33, 523.25, 587.33,
                659.25, 587.33, 523.25, 440.00, 523.25, 587.33,
                659.25, 698.46, 659.25, 587.33, 523.25, 587.33
            ],
            tempo: 3.5,
            waveform: 'triangle',
            melodyWave: 'sine'
        },
        adoracion: {
            chords: [
                [261.63, 329.63, 392.00, 523.25],
                [246.94, 293.66, 392.00, 493.88],
                [220.00, 261.63, 329.63, 440.00],
                [174.61, 220.00, 261.63, 349.23]
            ],
            melody: [
                523.25, 659.25, 783.99, 659.25, 587.33, 523.25,
                493.88, 587.33, 659.25, 587.33, 523.25, 440.00,
                523.25, 659.25, 783.99, 880.00, 783.99, 659.25,
                587.33, 523.25, 440.00, 392.00, 440.00, 523.25
            ],
            tempo: 4.5,
            waveform: 'sine',
            melodyWave: 'triangle'
        }
    };

    function init() {
        if (ctx) return;
        ctx = new (window.AudioContext || window.webkitAudioContext)();

        masterGain = ctx.createGain();
        masterGain.gain.value = 0.18;
        masterGain.connect(ctx.destination);

        const convolver = ctx.createConvolver();
        convolver.buffer = crearImpulsoReverb(ctx, 3.5, 2.5);

        reverbGain = ctx.createGain();
        reverbGain.gain.value = 0.45;

        reverbGain.connect(convolver);
        convolver.connect(masterGain);
    }

    function crearImpulsoReverb(ctx, duracion, decay) {
        const rate = ctx.sampleRate;
        const length = rate * duracion;
        const impulse = ctx.createBuffer(2, length, rate);
        for (let canal = 0; canal < 2; canal++) {
            const data = impulse.getChannelData(canal);
            for (let i = 0; i < length; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, decay);
            }
        }
        return impulse;
    }

    function playNote(freq, startTime, duration, waveform, gainValue) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = waveform;
        osc.frequency.value = freq;

        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(gainValue, startTime + duration * 0.2);
        gain.gain.linearRampToValueAtTime(gainValue * 0.6, startTime + duration * 0.5);
        gain.gain.linearRampToValueAtTime(0, startTime + duration);

        osc.connect(gain);
        gain.connect(masterGain);
        gain.connect(reverbGain);

        osc.start(startTime);
        osc.stop(startTime + duration);

        activeOscillators.push(osc);
        osc.onended = () => {
            const idx = activeOscillators.indexOf(osc);
            if (idx > -1) activeOscillators.splice(idx, 1);
        };
    }

    function programarCiclo() {
        if (!isPlaying || !currentProgression) return;

        const prog = PROGRESIONES[currentProgression];
        const now = ctx.currentTime + 0.1;
        const segPorAcorde = prog.tempo;

        prog.chords.forEach((chord, i) => {
            const startTime = now + i * segPorAcorde;
            chord.forEach((freq, j) => {
                const offset = j * 0.05;
                const ganancia = 0.12 / (j + 1);
                playNote(freq, startTime + offset, segPorAcorde * 1.1, prog.waveform, ganancia);
                playNote(freq * 2, startTime + offset + 0.02, segPorAcorde * 0.9, prog.waveform, ganancia * 0.35);
            });
        });

        const duracionMelodia = segPorAcorde / 2;
        prog.melody.forEach((freq, i) => {
            const startTime = now + i * duracionMelodia;
            playNote(freq, startTime, duracionMelodia * 1.4, prog.melodyWave, 0.09);
        });

        const duracionCiclo = prog.chords.length * segPorAcorde;
        loopTimer = setTimeout(() => {
            if (isPlaying) programarCiclo();
        }, duracionCiclo * 1000 - 100);
    }

    async function start(progression) {
        init();
        if (ctx.state === 'suspended') await ctx.resume();

        currentProgression = progression;
        if (isPlaying) return;

        isPlaying = true;
        masterGain.gain.cancelScheduledValues(ctx.currentTime);
        masterGain.gain.setValueAtTime(0, ctx.currentTime);
        masterGain.gain.linearRampToValueAtTime(0.18, ctx.currentTime + 2);

        programarCiclo();
    }

    function stop() {
        isPlaying = false;
        if (loopTimer) {
            clearTimeout(loopTimer);
            loopTimer = null;
        }
        if (ctx && masterGain) {
            masterGain.gain.cancelScheduledValues(ctx.currentTime);
            masterGain.gain.setValueAtTime(masterGain.gain.value, ctx.currentTime);
            masterGain.gain.linearRampToValueAtTime(0, ctx.currentTime + 1);
        }
        setTimeout(() => {
            activeOscillators.forEach(osc => {
                try { osc.stop(); } catch (e) {}
            });
            activeOscillators = [];
        }, 1100);
    }

    function changeProgression(progression) {
        if (currentProgression === progression) return;
        currentProgression = progression;
        if (isPlaying) {
            activeOscillators.forEach(osc => {
                try { osc.stop(); } catch (e) {}
            });
            activeOscillators = [];
            if (loopTimer) clearTimeout(loopTimer);
            programarCiclo();
        }
    }

    return { start, stop, changeProgression, isPlaying: () => isPlaying };
})();

// ============================================================
//  CONTROL DE MÚSICA
// ============================================================
async function activarMusica() {
    if (!sonidoActivo) return;

    if (modoMusica === 'url') {
        const url = selectorMusica.value;
        if (fuenteAudio.src !== url) {
            fuenteAudio.src = url;
            audioFondo.load();
        }
        audioFondo.currentTime = 0;
        audioFondo.volume = 0.35;
        const p = audioFondo.play();
        if (p !== undefined) p.catch(() => {});
    } else {
        audioFondo.pause();
        await MusicEngine.start(modoMusica);
    }
}

function desactivarMusica() {
    MusicEngine.stop();
    audioFondo.pause();
}

function toggleSonido() {
    sonidoActivo = !sonidoActivo;

    if (sonidoActivo) {
        btnSonido.textContent = '🔊';
        btnSonido.title = 'Desactivar música';
        btnSonido.classList.remove('silenciado');
        if (versiculoActual) activarMusica();
    } else {
        btnSonido.textContent = '🔇';
        btnSonido.title = 'Activar música';
        btnSonido.classList.add('silenciado');
        desactivarMusica();
    }
}

selectorMusica.addEventListener('change', async () => {
    const valor = selectorMusica.value;

    if (valor.startsWith('http')) {
        modoMusica = 'url';
    } else {
        modoMusica = valor;
        MusicEngine.stop();
        audioFondo.pause();
    }

    if (sonidoActivo && versiculoActual) {
        await activarMusica();
    }
});

// ============================================================
//  CONSULTAR VERSÍCULO
// ============================================================
async function consultarVersiculo() {
    const libro = selectorLibro.value;
    const capitulo = inputCapitulo.value.trim();
    const versiculo = inputVersiculo.value.trim();

    if (!capitulo || !versiculo) {
        mostrarError('Completa el capítulo y el versículo.');
        return;
    }

    const capNum = Number(capitulo);
    const verNum = Number(versiculo);
    if (!Number.isInteger(capNum) || !Number.isInteger(verNum) || capNum < 1 || verNum < 1) {
        mostrarError('El capítulo y el versículo deben ser números enteros positivos.');
        return;
    }

    mostrarCargando();
    btnCopiar.disabled = true;

    try {
        const url = `${API_BASE}/${VERSION}/${libro}/${capNum}/${verNum}`;
        const respuesta = await fetch(url);

        if (!respuesta.ok) {
            if (respuesta.status === 404) {
                throw new Error(`No se encontró ${libro} ${capNum}:${verNum}. Verifica los datos.`);
            } else {
                throw new Error(`Error en la consulta (código ${respuesta.status}).`);
            }
        }

        const datos = await respuesta.json();
        if (!datos.data || !datos.data.text) {
            throw new Error('La respuesta de la API no contiene el texto del versículo.');
        }

        const ref = `${datos.data.book} ${datos.data.chapter}:${datos.data.verse}`;
        const textoLimpio = datos.data.text.replace(/\n+/g, ' ').trim();

        versiculoActual = { referencia: ref, texto: textoLimpio };
        mostrarVersiculo(ref, textoLimpio);
        agregarAlHistorial(ref, capNum, verNum, libro);
        activarMusica();

    } catch (error) {
        console.error(error);
        mostrarError(error.message || 'Error al consultar. Intenta de nuevo.');
        versiculoActual = null;
    }
}

// ============================================================
//  MOSTRAR ESTADOS
// ============================================================
function mostrarCargando() {
    resultadoDiv.className = 'resultado';
    referenciaDiv.textContent = '';
    textoVersiculoDiv.innerHTML = '<span class="spinner"></span> Consultando la Palabra...';
}

function mostrarVersiculo(referencia, texto) {
    resultadoDiv.className = 'resultado';
    referenciaDiv.textContent = referencia;
    textoVersiculoDiv.innerHTML = `"${texto}" <span class="cita">— RVR1960</span>`;
    btnCopiar.disabled = false;
}

function mostrarError(mensaje) {
    resultadoDiv.className = 'resultado error';
    referenciaDiv.textContent = '';
    textoVersiculoDiv.innerHTML = `<span style="color:#b85c4a;">⚠️ ${mensaje}</span>`;
    btnCopiar.disabled = true;
}

// ============================================================
//  COPIAR VERSÍCULO
// ============================================================
btnCopiar.addEventListener('click', async () => {
    if (!versiculoActual) return;
    const textoCompleto = `"${versiculoActual.texto}" — ${versiculoActual.referencia} (RVR1960)`;

    try {
        await navigator.clipboard.writeText(textoCompleto);
        btnCopiar.textContent = '✅ Copiado';
        setTimeout(() => { btnCopiar.textContent = '📋 Copiar versículo'; }, 1800);
    } catch (err) {
        const textarea = document.createElement('textarea');
        textarea.value = textoCompleto;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        btnCopiar.textContent = '✅ Copiado';
        setTimeout(() => { btnCopiar.textContent = '📋 Copiar versículo'; }, 1800);
    }
});

// ============================================================
//  HISTORIAL
// ============================================================
function agregarAlHistorial(referencia, capitulo, versiculo, libro) {
    if (historial.length > 0 && historial[0].referencia === referencia) return;
    historial.unshift({ referencia, capitulo, versiculo, libro });
    if (historial.length > 8) historial.pop();
    renderizarHistorial();
}

function renderizarHistorial() {
    if (historial.length === 0) {
        historialLista.innerHTML = '<span class="historial-vacio">Aún no hay consultas.</span>';
        return;
    }

    historialLista.innerHTML = historial.map(item =>
        `<button class="historial-item" data-libro="${item.libro}" data-capitulo="${item.capitulo}" data-versiculo="${item.versiculo}">${item.referencia}</button>`
    ).join('');

    historialLista.querySelectorAll('.historial-item').forEach(btn => {
        btn.addEventListener('click', () => {
            selectorLibro.value = btn.dataset.libro;
            inputCapitulo.value = btn.dataset.capitulo;
            inputVersiculo.value = btn.dataset.versiculo;
            consultarVersiculo();
        });
    });
}

// ============================================================
//  EVENTOS
// ============================================================
btnConsultar.addEventListener('click', consultarVersiculo);
btnSonido.addEventListener('click', toggleSonido);

[inputCapitulo, inputVersiculo].forEach(input => {
    input.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); consultarVersiculo(); }
    });
});

audioFondo.load();
</script>
