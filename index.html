            "17": "el Espíritu de verdad, al cual el mundo no puede recibir, porque no le ve, ni le conoce; pero vosotros le conocéis, porque mora con vosotros, y estará en vosotros.",
            "21": "El que tiene mis mandamientos, y los guarda, ése es el que me ama; y el que me ama, será amado por mi Padre, y yo le amaré, y me manifestaré a él.",
            "27": "La paz os dejo, mi paz os doy; yo no os la doy como el mundo la da. No se turbe vuestro corazón, ni tenga miedo."
        },
        "15": {
            "5": "Yo soy la vid, vosotros los pámpanos; el que permanece en mí, y yo en él, éste lleva mucho fruto; porque separados de mí nada podéis hacer.",
            "7": "Si permanecéis en mí, y mis palabras permanecen en vosotros, pedid todo lo que queréis, y os será hecho.",
            "9": "Como el Padre me ha amado, así también yo os he amado; permaneced en mi amor.",
            "12": "Este es mi mandamiento: Que os améis unos a otros, como yo os he amado.",
            "13": "Nadie tiene mayor amor que este, que uno ponga su vida por sus amigos.",
            "15": "Ya no os llamaré siervos, porque el siervo no sabe lo que hace su señor; pero os he llamado amigos, porque todas las cosas que oí de mi Padre, os las he dado a conocer."
        },
        "16": {
            "24": "Hasta ahora nada habéis pedido en mi nombre; pedid, y recibiréis, para que vuestro gozo sea cumplido.",
            "33": "Estas cosas os he hablado para que en mí tengáis paz. En el mundo tendréis aflicción; pero confiad, yo he vencido al mundo."
        },
        "17": {
            "3": "Y esta es la vida eterna: que te conozcan a ti, el único Dios verdadero, y a Jesucristo, a quien has enviado."
        }
    },
    "hechos": {
        "1": {
            "8": "pero recibiréis poder, cuando haya venido sobre vosotros el Espíritu Santo, y me seréis testigos en Jerusalén, en toda Judea, en Samaria, y hasta lo último de la tierra."
        },
        "2": {
            "38": "Pedro les dijo: Arrepentíos, y bautícese cada uno de vosotros en el nombre de Jesucristo para perdón de los pecados; y recibiréis el don del Espíritu Santo.",
            "42": "Y perseveraban en la doctrina de los apóstoles, en la comunión unos con otros, en el partimiento del pan y en las oraciones."
        },
        "4": {
            "12": "Y en ningún otro hay salvación; porque no hay otro nombre bajo el cielo, dado a los hombres, en que podamos ser salvos."
        },
        "16": {
            "31": "Y ellos dijeron: Cree en el Señor Jesucristo, y serás salvo, tú y tu casa."
        },
        "18": {
            "10": "Porque yo estoy contigo, y ninguno pondrá sobre ti la mano para hacerte mal, porque yo tengo mucho pueblo en esta ciudad."
        }
    },
    "romanos": {
        "1": {
            "16": "Porque no me avergüenzo del evangelio, porque es poder de Dios para salvación a todo aquel que cree; al judío primeramente, y también al griego.",
            "17": "Porque en el evangelio la justicia de Dios se revela por fe y para fe, como está escrito: Mas el justo por la fe vivirá."
        },
        "3": {
            "23": "por cuanto todos pecaron, y están destituidos de la gloria de Dios,"
        },
        "5": {
            "1": "Justificados, pues, por la fe, tenemos paz para con Dios por medio de nuestro Señor Jesucristo;",
            "5": "y la esperanza no avergüenza; porque el amor de Dios ha sido derramado en nuestros corazones por el Espíritu Santo que nos fue dado.",
            "8": "Mas Dios muestra su amor para con nosotros, en que siendo aún pecadores, Cristo murió por nosotros."
        },
        "6": {
            "23": "Porque la paga del pecado es muerte, mas la dádiva de Dios es vida eterna en Cristo Jesús Señor nuestro."
        },
        "8": {
            "1": "Ahora, pues, ninguna condenación hay para los que están en Cristo Jesús, los que no andan conforme a la carne, sino conforme al Espíritu.",
            "14": "Porque todos los que son guiados por el Espíritu de Dios, éstos son hijos de Dios.",
            "15": "Pues no habéis recibido el espíritu de esclavitud para estar otra vez en temor, sino que habéis recibido el espíritu de adopción, por el cual clamamos: ¡Abba, Padre!",
            "16": "El Espíritu mismo da testimonio a nuestro espíritu, de que somos hijos de Dios.",
            "18": "Pues tengo por cierto que las aflicciones del tiempo presente no son comparables con la gloria venidera que en nosotros ha de manifestarse.",
            "28": "Y sabemos que a los que aman a Dios, todas las cosas les ayudan a bien, esto es, a los que conforme a su propósito son llamados.",
            "31": "¿Qué, pues, diremos a esto? Si Dios es por nosotros, ¿quién contra nosotros?",
            "32": "El que no escatimó ni a su propio Hijo, sino que lo entregó por todos nosotros, ¿cómo no nos dará también con él todas las cosas?",
            "35": "¿Quién nos separará del amor de Cristo? ¿Tribulación, o angustia, o persecución, o hambre, o desnudez, o peligro, o espada?",
            "37": "Antes, en todas estas cosas somos más que vencedores por medio de aquel que nos amó.",
            "38": "Por lo cual estoy seguro de que ni la muerte, ni la vida, ni ángeles, ni principados, ni potestades, ni lo presente, ni lo por venir,",
            "39": "ni lo alto, ni lo profundo, ni ninguna otra cosa creada nos podrá separar del amor de Dios, que es en Cristo Jesús Señor nuestro."
        },
        "10": {
            "9": "que si confesares con tu boca que Jesús es el Señor, y creyeres en tu corazón que Dios le levantó de los muertos, serás salvo.",
            "10": "Porque con el corazón se cree para justicia, pero con la boca se confiesa para salvación.",
            "13": "porque todo aquel que invocare el nombre del Señor, será salvo.",
            "17": "Así que la fe es por el oír, y el oír, por la palabra de Dios."
        },
        "12": {
            "1": "Así que, hermanos, os ruego por las misericordias de Dios, que presentéis vuestros cuerpos en sacrificio vivo, santo, agradable a Dios, que es vuestro culto racional.",
            "2": "No os conforméis a este siglo, sino transformaos por medio de la renovación de vuestro entendimiento, para que comprobéis cuál sea la buena voluntad de Dios, agradable y perfecta.",
            "12": "Gozosos en la esperanza; sufridos en la tribulación; constantes en la oración;",
            "21": "No seas vencido de lo malo, sino vence con el bien el mal."
        },
        "15": {
            "13": "Y el Dios de esperanza os llene de todo gozo y paz en el creer, para que abundéis en esperanza por el poder del Espíritu Santo."
        }
    },
    "1corintios": {
        "1": {
            "9": "Fiel es Dios, por el cual fuisteis llamados a la comunión con su Hijo Jesucristo nuestro Señor."
        },
        "2": {
            "9": "Antes bien, como está escrito: Cosas que ojo no vio, ni oído oyó, ni han subido en corazón de hombre, son las que Dios ha preparado para los que le aman."
        },
        "10": {
            "13": "No os ha sobrevenido ninguna tentación que no sea humana; pero fiel es Dios, que no os dejará ser tentados más de lo que podéis resistir, sino que dará también juntamente con la tentación la salida, para que podáis soportar."
        },
        "13": {
            "1": "Si yo hablase lenguas humanas y angélicas, y no tengo amor, vengo a ser como metal que resuena, o címbalo que retiñe.",
            "2": "Y si tuviese profecía, y entendiese todos los misterios y toda ciencia, y si tuviese toda la fe, de tal manera que trasladase los montes, y no tengo amor, nada soy.",
            "3": "Y si repartiese todos mis bienes para dar de comer a los pobres, y si entregase mi cuerpo para ser quemado, y no tengo amor, de nada me sirve.",
            "4": "El amor es sufrido, es benigno; el amor no tiene envidia, el amor no es jactancioso, no se envanece;",
            "5": "no hace nada indebido, no busca lo suyo, no se irrita, no guarda rencor;",
            "6": "no se goza de la injusticia, mas se goza de la verdad.",
            "7": "Todo lo sufre, todo lo cree, todo lo espera, todo lo soporta.",
            "8": "El amor nunca deja de ser; pero las profecías se acabarán, y cesarán las lenguas, y la ciencia acabará.",
            "13": "Y ahora permanecen la fe, la esperanza y el amor, estos tres; pero el mayor de ellos es el amor."
        },
        "15": {
            "57": "Mas gracias sean dadas a Dios, que nos da la victoria por medio de nuestro Señor Jesucristo."
        },
        "16": {
            "14": "Todas vuestras cosas sean hechas con amor."
        }
    },
    "2corintios": {
        "4": {
            "16": "Por tanto, no desmayamos; antes aunque este nuestro hombre exterior se va desgastando, el interior no obstante se renueva de día en día.",
            "17": "Porque esta leve tribulación momentánea produce en nosotros un cada vez más excelente y eterno peso de gloria;",
            "18": "no mirando nosotros las cosas que se ven, sino las que no se ven; pues las cosas que se ven son temporales, pero las que no se ven son eternas."
        },
        "5": {
            "7": "(porque por fe andamos, no por vista);",
            "17": "De modo que si alguno está en Cristo, nueva criatura es; las cosas viejas pasaron; he aquí todas son hechas nuevas.",
            "21": "Al que no conoció pecado, por nosotros lo hizo pecado, para que nosotros fuésemos hechos justicia de Dios en él."
        },
        "9": {
            "7": "Cada uno dé como propuso en su corazón: no con tristeza, ni por necesidad, porque Dios ama al dador alegre."
        },
        "12": {
            "9": "Y me ha dicho: Bástate mi gracia; porque mi poder se perfecciona en la debilidad. Por tanto, de buena gana me gloriaré más bien en mis debilidades, para que repose sobre mí el poder de Cristo."
        }
    },
    "galatas": {
        "2": {
            "20": "Con Cristo estoy juntamente crucificado, y ya no vivo yo, mas vive Cristo en mí; y lo que ahora vivo en la carne, lo vivo en la fe del Hijo de Dios, el cual me amó y se entregó a sí mismo por mí."
        },
        "5": {
            "1": "Estad, pues, firmes en la libertad con que Cristo nos hizo libres, y no estéis otra vez sujetos al yugo de esclavitud.",
            "22": "Mas el fruto del Espíritu es amor, gozo, paz, paciencia, benignidad, bondad, fe,",
            "23": "mansedumbre, templanza; contra tales cosas no hay ley."
        },
        "6": {
            "9": "No nos cansemos, pues, de hacer bien; porque a su tiempo segaremos, si no desmayamos."
        }
    },
    "efesios": {
        "1": {
            "3": "Bendito sea el Dios y Padre de nuestro Señor Jesucristo, que nos bendijo con toda bendición espiritual en los lugares celestiales en Cristo.",
            "7": "en quien tenemos redención por su sangre, el perdón de pecados según las riquezas de su gracia.",
            "13": "En él también vosotros, habiendo oído la palabra de verdad, el evangelio de vuestra salvación, y habiendo creído en él, fuisteis sellados con el Espíritu Santo de la promesa."
        },
        "2": {
            "4": "Pero Dios, que es rico en misericordia, por su gran amor con que nos amó,",
            "5": "aun estando nosotros muertos en pecados, nos dio vida juntamente con Cristo (por gracia sois salvos),",
            "6": "y juntamente con él nos resucitó, y asimismo nos hizo sentar en los lugares celestiales con Cristo Jesús,",
            "7": "para mostrar en los siglos venideros las abundantes riquezas de su gracia en su bondad para con nosotros en Cristo Jesús.",
            "8": "Porque por gracia sois salvos por medio de la fe; y esto no de vosotros, pues es don de Dios;",
            "9": "no por obras, para que nadie se gloríe.",
            "10": "Porque somos hechura suya, creados en Cristo Jesús para buenas obras, las cuales Dios preparó de antemano para que anduviésemos en ellas."
        },
        "3": {
            "20": "Y a Aquel que es poderoso para hacer todas las cosas mucho más abundantemente de lo que pedimos o entendemos, según el poder que actúa en nosotros,"
        },
        "4": {
            "32": "Antes sed benignos unos con otros, misericordiosos, perdonándoos unos a otros, como Dios también os perdonó a vosotros en Cristo."
        },
        "6": {
            "10": "Por lo demás, hermanos míos, fortaleceos en el Señor, y en el poder de su fuerza.",
            "11": "Vestíos de toda la armadura de Dios, para que podáis estar firmes contra las asechanzas del diablo."
        }
    },
    "filipenses": {
        "1": {
            "6": "estando persuadido de esto, que el que comenzó en vosotros la buena obra, la perfeccionará hasta el día de Jesucristo;"
        },
        "2": {
            "3": "Nada hagáis por contienda o por vanagloria; antes bien con humildad, estimando cada uno a los demás como superiores a él mismo;",
            "4": "no mirando cada uno por lo suyo propio, sino cada cual también por lo de los otros.",
            "13": "porque Dios es el que en vosotros produce así el querer como el hacer, por su buena voluntad."
        },
        "3": {
            "13": "Hermanos, yo no pretendo haberlo ya alcanzado; pero una cosa hago: olvidando ciertamente lo que queda atrás, y extendiéndome a lo que está delante,",
            "14": "prosigo a la meta, al premio del supremo llamamiento de Dios en Cristo Jesús."
        },
        "4": {
            "4": "Regocijaos en el Señor siempre. Otra vez digo: ¡Regocijaos!",
            "6": "Por nada estéis afanosos, sino sean conocidas vuestras peticiones delante de Dios en toda oración y ruego, con acción de gracias.",
            "7": "Y la paz de Dios, que sobrepasa todo entendimiento, guardará vuestros corazones y vuestros pensamientos en Cristo Jesús.",
            "8": "Por lo demás, hermanos, todo lo que es verdadero, todo lo honesto, todo lo justo, todo lo puro, todo lo amable, todo lo que es de buen nombre; si hay virtud alguna, si algo digno de alabanza, en esto pensad.",
            "13": "Todo lo puedo en Cristo que me fortalece.",
            "19": "Mi Dios, pues, suplirá todo lo que os falta conforme a sus riquezas en gloria en Cristo Jesús."
        }
    },
    "colosenses": {
        "1": {
            "16": "Porque en él fueron creadas todas las cosas, las que hay en los cielos y las que hay en la tierra, visibles e invisibles; sean tronos, sean dominios, sean principados, sean potestades; todo fue creado por medio de él y para él.",
            "17": "Y él es antes de todas las cosas, y todas las cosas en él subsisten."
        },
        "3": {
            "12": "Vestíos, pues, como escogidos de Dios, santos y amados, de entrañable misericordia, de benignidad, de humildad, de mansedumbre, de paciencia;",
            "13": "soportándoos unos a otros, y perdonándoos unos a otros si alguno tuviere queja contra otro. De la manera que Cristo os perdonó, así también hacedlo vosotros.",
            "14": "Y sobre todas estas cosas vestíos de amor, que es el vínculo perfecto.",
            "15": "Y la paz de Dios gobierne en vuestros corazones, a la que asimismo fuisteis llamados en un solo cuerpo; y sed agradecidos.",
            "16": "La palabra de Cristo more en abundancia en vosotros, enseñándoos y exhortándoos unos a otros en toda sabiduría, cantando con gracia en vuestros corazones al Señor con salmos e himnos y cánticos espirituales.",
            "17": "Y todo lo que hacéis, sea de palabra o de hecho, hacedlo todo en el nombre del Señor Jesús, dando gracias a Dios Padre por medio de él.",
            "23": "Y todo lo que hagáis, hacedlo de corazón, como para el Señor y no para los hombres."
        }
    },
    "1tesalonicenses": {
        "5": {
            "16": "Estad siempre gozosos.",
            "17": "Orad sin cesar.",
            "18": "Dad gracias en todo, porque esta es la voluntad de Dios para con vosotros en Cristo Jesús.",
            "24": "Fiel es el que os llama, el cual también lo hará."
        }
    },
    "2timoteo": {
        "1": {
            "7": "Porque no nos ha dado Dios espíritu de cobardía, sino de poder, de amor y de dominio propio."
        },
        "3": {
            "16": "Toda la Escritura es inspirada por Dios, y útil para enseñar, para redargüir, para corregir, para instruir en justicia."
        },
        "4": {
            "7": "He peleado la buena batalla, he acabado la carrera, he guardado la fe."
        }
    },
    "hebreos": {
        "4": {
            "12": "Porque la palabra de Dios es viva y eficaz, y más cortante que toda espada de dos filos; y penetra hasta partir el alma y el espíritu, las coyunturas y los tuétanos, y discierne los pensamientos y las intenciones del corazón.",
            "16": "Acerquémonos, pues, confiadamente al trono de la gracia, para alcanzar misericordia y hallar gracia para el oportuno socorro."
        },
        "10": {
            "23": "Mantengamos firme, sin fluctuar, la profesión de nuestra esperanza, porque fiel es el que prometió."
        },
        "11": {
            "1": "Es, pues, la fe la certeza de lo que se espera, la convicción de lo que no se ve.",
            "6": "Pero sin fe es imposible agradar a Dios; porque es necesario que el que se acerca a Dios crea que le hay, y que es galardonador de los que le buscan."
        },
        "12": {
            "1": "Por tanto, nosotros también, teniendo en derredor nuestro tan grande nube de testigos, despojémonos de todo peso y del pecado que nos asedia, y corramos con paciencia la carrera que tenemos por delante,",
            "2": "puestos los ojos en Jesús, el autor y consumador de la fe, el cual por el gozo puesto delante de él sufrió la cruz, menospreciando el oprobio, y se sentó a la diestra del trono de Dios."
        },
        "13": {
            "5": "Sean vuestras costumbres sin avaricia, contentos con lo que tenéis ahora; porque él dijo: No te desampararé, ni te dejaré.",
            "8": "Jesucristo es el mismo ayer, y hoy, y por los siglos."
        }
    },
    "santiago": {
        "1": {
            "2": "Hermanos míos, tened por sumo gozo cuando os halléis en diversas pruebas,",
            "3": "sabiendo que la prueba de vuestra fe produce paciencia.",
            "4": "Mas tenga la paciencia su obra completa, para que seáis perfectos y cabales, sin que os falte cosa alguna.",
            "5": "Y si alguno de vosotros tiene falta de sabiduría, pídala a Dios, el cual da a todos abundantemente y sin reproche, y le será dada.",
            "6": "Pero pida con fe, no dudando nada; porque el que duda es semejante a la onda del mar, que es arrastrada por el viento y echada de una parte a otra.",
            "12": "Bienaventurado el varón que soporta la tentación; porque cuando haya resistido la prueba, recibirá la corona de vida, que Dios ha prometido a los que le aman.",
            "17": "Toda buena dádiva y todo don perfecto descienden de lo alto, del Padre de las luces, en el cual no hay mudanza, ni sombra de variación.",
            "22": "Pero sed hacedores de la palabra, y no tan solamente oidores, engañándoos a vosotros mismos."
        },
        "4": {
            "7": "Someteos, pues, a Dios; resistid al diablo, y huirá de vosotros.",
            "8": "Acercaos a Dios, y él se acercará a vosotros. Pecadores, limpiad las manos; y vosotros los de doble ánimo, purificad vuestros corazones.",
            "10": "Humillaos delante del Señor, y él os exaltará."
        },
        "5": {
            "16": "Confesaos vuestras ofensas unos a otros, y orad unos por otros, para que seáis sanados. La oración eficaz del justo puede mucho."
        }
    },
    "1pedro": {
        "1": {
            "3": "Bendito el Dios y Padre de nuestro Señor Jesucristo, que según su grande misericordia nos hizo renacer para una esperanza viva, por la resurrección de Jesucristo de los muertos,",
            "7": "para que sometida a prueba vuestra fe, mucho más preciosa que el oro, el cual aunque perecedero se prueba con fuego, sea hallada en alabanza, gloria y honra cuando sea manifestado Jesucristo."
        },
        "2": {
            "9": "Mas vosotros sois linaje escogido, real sacerdocio, nación santa, pueblo adquirido por Dios, para que anunciéis las virtudes de aquel que os llamó de las tinieblas a su luz admirable;",
            "24": "quien llevó él mismo nuestros pecados en su cuerpo sobre el madero, para que nosotros, estando muertos a los pecados, vivamos a la justicia; y por cuya herida fuisteis sanados."
        },
        "5": {
            "7": "echando toda vuestra ansiedad sobre él, porque él tiene cuidado de vosotros.",
            "10": "Mas el Dios de toda gracia, que nos llamó a su gloria eterna en Jesucristo, después que hayáis padecido un poco de tiempo, él mismo os perfeccione, afirme, fortalezca y establezca."
        }
    },
    "1juan": {
        "1": {
            "5": "Este es el mensaje que hemos oído de él, y os anunciamos: Dios es luz, y no hay ningunas tinieblas en él.",
            "7": "pero si andamos en luz, como él está en luz, tenemos comunión unos con otros, y la sangre de Jesucristo su Hijo nos limpia de todo pecado.",
            "9": "Si confesamos nuestros pecados, él es fiel y justo para perdonar nuestros pecados, y limpiarnos de toda maldad."
        },
        "4": {
            "4": "Hijitos, vosotros sois de Dios, y los habéis vencido; porque mayor es el que está en vosotros, que el que está en el mundo.",
            "7": "Amados, amémonos unos a otros; porque el amor es de Dios. Todo aquel que ama, es nacido de Dios, y conoce a Dios.",
            "8": "El que no ama, no ha conocido a Dios; porque Dios es amor.",
            "18": "En el amor no hay temor, sino que el perfecto amor echa fuera el temor; porque el temor lleva en sí castigo. De donde el que teme, no ha sido perfeccionado en el amor.",
            "19": "Nosotros le amamos a él, porque él nos amó primero."
        },
        "5": {
            "4": "Porque todo lo que es nacido de Dios vence al mundo; y esta es la victoria que ha vencido al mundo, nuestra fe.",
            "14": "Y esta es la confianza que tenemos en él, que si pedimos alguna cosa conforme a su voluntad, él nos oye.",
            "15": "Y si sabemos que él nos oye en cualquiera cosa que pidamos, sabemos que tenemos las peticiones que le hayamos hecho."
        }
    },
    "judas": {
        "1": {
            "24": "Y a aquel que es poderoso para guardaros sin caída, y presentaros sin mancha delante de su gloria con gran alegría,"
        }
    },
    "apocalipsis": {
        "1": {
            "8": "Yo soy el Alfa y la Omega, principio y fin, dice el Señor, el que es y que era y que ha de venir, el Todopoderoso.",
            "17": "Cuando le vi, caí como muerto a sus pies. Y él puso su diestra sobre mí, diciéndome: No temas; yo soy el primero y el último;"
        },
        "3": {
            "20": "He aquí, yo estoy a la puerta y llamo; si alguno oye mi voz y abre la puerta, entraré a él, y cenaré con él, y él conmigo."
        },
        "21": {
            "1": "Vi un cielo nuevo y una tierra nueva; porque el primer cielo y la primera tierra pasaron, y el mar ya no existía más.",
            "2": "Y yo Juan vi la santa ciudad, la nueva Jerusalén, descender del cielo, de Dios, dispuesta como una esposa ataviada para su marido.",
            "3": "Y oí una gran voz del cielo que decía: He aquí el tabernáculo de Dios con los hombres, y él morará con ellos; y ellos serán su pueblo, y Dios mismo estará con ellos como su Dios.",
            "4": "Enjugará Dios toda lágrima de los ojos de ellos; y ya no habrá muerte, ni habrá más llanto, ni clamor, ni dolor; porque las primeras cosas pasaron.",
            "5": "Y el que estaba sentado en el trono dijo: He aquí, yo hago nuevas todas las cosas. Y me dijo: Escribe; porque estas palabras son fieles y verdaderas."
        },
        "22": {
            "13": "Yo soy el Alfa y la Omega, el primero y el último, el principio y el fin."
        }
    }
};

// ============================================================
//  CONFIGURACIÓN
// ============================================================
const API_BASE = 'https://api.midvash.com/v1';
const VERSION  = 'rvr1960';

const selectorLibro     = document.getElementById('selectorLibro');
const selectorMusica    = document.getElementById('selectorMusica');
const selectorVoz       = document.getElementById('selectorVoz');
const velocidadVoz      = document.getElementById('velocidadVoz');
const volumenVoz        = document.getElementById('volumenVoz');
const valorVelocidad    = document.getElementById('valorVelocidad');
const inputCapitulo     = document.getElementById('capitulo');
const inputVersiculo    = document.getElementById('versiculo');
const btnConsultar      = document.getElementById('btnConsultar');
const btnSonido         = document.getElementById('btnSonido');
const btnLeer           = document.getElementById('btnLeer');
const btnDetenerVoz     = document.getElementById('btnDetenerVoz');
const btnCopiar         = document.getElementById('btnCopiar');
const resultadoDiv      = document.getElementById('resultado');
const referenciaDiv     = document.getElementById('referencia');
const textoVersiculoDiv = document.getElementById('textoVersiculo');
const historialLista    = document.getElementById('historialLista');
const audioFondo        = document.getElementById('audioFondo');
const fuenteAudio       = document.getElementById('fuenteAudio');

let sonidoActivo = true;
let versiculoActual = null;
let historial = [];
let modoMusica = 'celestial';

// ============================================================
//  VOZ (Web Speech API)
// ============================================================
let vocesDisponibles = [];
let vozSeleccionada = null;
let utteranceActual = null;

function cargarVoces() {
    vocesDisponibles = window.speechSynthesis.getVoices();
    if (vocesDisponibles.length === 0) return;

    // Priorizar voces en español
    const vocesEspanol = vocesDisponibles.filter(v => v.lang.startsWith('es'));

    selectorVoz.innerHTML = '';

    if (vocesEspanol.length > 0) {
        const grupoEs = document.createElement('optgroup');
        grupoEs.label = 'Español';
        vocesEspanol.forEach(v => {
            const opt = document.createElement('option');
            opt.value = v.name;
            opt.textContent = `${v.name} (${v.lang})`;
            grupoEs.appendChild(opt);
        });
        selectorVoz.appendChild(grupoEs);
    }

    // Otras voces
    const otrasVoces = vocesDisponibles.filter(v => !v.lang.startsWith('es'));
    if (otrasVoces.length > 0) {
        const grupoOtras = document.createElement('optgroup');
        grupoOtras.label = 'Otros idiomas';
        otrasVoces.forEach(v => {
            const opt = document.createElement('option');
            opt.value = v.name;
            opt.textContent = `${v.name} (${v.lang})`;
            grupoOtras.appendChild(opt);
        });
        selectorVoz.appendChild(grupoOtras);
    }

    // Seleccionar la primera voz en español
    if (vocesEspanol.length > 0) {
        vozSeleccionada = vocesEspanol[0];
        selectorVoz.value = vozSeleccionada.name;
    } else if (vocesDisponibles.length > 0) {
        vozSeleccionada = vocesDisponibles[0];
        selectorVoz.value = vozSeleccionada.name;
    }
}

function leerVersiculo() {
    if (!versiculoActual) return;

    window.speechSynthesis.cancel();

    const texto = versiculoActual.texto;
    utteranceActual = new SpeechSynthesisUtterance(texto);

    // Configurar voz
    if (vozSeleccionada) {
        utteranceActual.voice = vozSeleccionada;
    } else {
        utteranceActual.lang = 'es-ES';
    }

    utteranceActual.rate = parseFloat(velocidadVoz.value);
    utteranceActual.volume = parseFloat(volumenVoz.value);
    utteranceActual.pitch = 1;

    utteranceActual.onstart = () => {
        resultadoDiv.classList.add('leyendo');
        btnLeer.textContent = '🔊 Leyendo...';
        btnLeer.disabled = true;
        btnDetenerVoz.disabled = false;
    };

    utteranceActual.onend = () => {
        resultadoDiv.classList.remove('leyendo');
        btnLeer.textContent = '🔊 Leer';
        btnLeer.disabled = false;
        btnDetenerVoz.disabled = true;
    };

    utteranceActual.onerror = (e) => {
        console.warn('Error de síntesis de voz:', e);
        resultadoDiv.classList.remove('leyendo');
        btnLeer.textContent = '🔊 Leer';
        btnLeer.disabled = false;
        btnDetenerVoz.disabled = true;
    };

    window.speechSynthesis.speak(utteranceActual);
}

function detenerLectura() {
    window.speechSynthesis.cancel();
    resultadoDiv.classList.remove('leyendo');
    btnLeer.textContent = '🔊 Leer';
    btnLeer.disabled = false;
    btnDetenerVoz.disabled = true;
}

// Cambio de voz
selectorVoz.addEventListener('change', () => {
    vozSeleccionada = vocesDisponibles.find(v => v.name === selectorVoz.value);
    // Si está leyendo, reiniciar con la nueva voz
    if (resultadoDiv.classList.contains('leyendo')) {
        leerVersiculo();
    }
});

// Cambio de velocidad
velocidadVoz.addEventListener('input', () => {
    valorVelocidad.textContent = parseFloat(velocidadVoz.value).toFixed(1);
    if (utteranceActual) {
        utteranceActual.rate = parseFloat(velocidadVoz.value);
    }
});

// Cambio de volumen
volumenVoz.addEventListener('input', () => {
    if (utteranceActual) {
        utteranceActual.volume = parseFloat(volumenVoz.value);
    }
});

btnLeer.addEventListener('click', leerVersiculo);
btnDetenerVoz.addEventListener('click', detenerLectura);

// Cargar voces (algunos navegadores las cargan de forma asíncrona)
if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = cargarVoces;
    cargarVoces();
    // Reintentar tras un breve lapso (Chrome a veces tarda)
    setTimeout(cargarVoces, 500);
} else {
    selectorVoz.innerHTML = '<option>Voz no disponible</option>';
    btnLeer.disabled = true;
}

// ============================================================
//  MOTOR DE MÚSICA PROCEDURAL (Web Audio API)
// ============================================================
const MusicEngine = (() => {
    let ctx = null;
    let masterGain = null;
    let reverbGain = null;
    let isPlaying = false;
    let currentProgression = null;
    let loopTimer = null;
    let activeOscillators = [];

    const PROGRESIONES = {
        celestial: {
            chords: [
                [261.63, 329.63, 392.00, 523.25],
                [220.00, 261.63, 329.63, 440.00],
                [174.61, 220.00, 261.63, 349.23],
                [196.00, 246.94, 293.66, 392.00]
            ],
            melody: [
                523.25, 587.33, 659.25, 783.99, 659.25, 587.33,
                523.25, 440.00, 523.25, 659.25, 587.33, 523.25,
                440.00, 392.00, 440.00, 523.25, 587.33, 523.25,
                392.00, 440.00, 493.88, 523.25, 587.33, 523.25
            ],
            tempo: 4.0,
            waveform: 'sine',
            melodyWave: 'triangle'
        },
        alegre: {
            chords: [
                [174.61, 220.00, 261.63, 349.23],
                [261.63, 329.63, 392.00, 523.25],
                [196.00, 246.94, 293.66, 392.00],
                [220.00, 261.63, 329.63, 440.00]
            ],
            melody: [
                698.46, 659.25, 587.33, 523.25, 587.33, 659.25,
                783.99, 698.46, 659.25, 587.33, 523.25, 587.33,
                659.25, 587.33, 523.25, 440.00, 523.25, 587.33,
                659.25, 698.46, 659.25, 587.33, 523.25, 587.33
            ],
            tempo: 3.5,
            waveform: 'triangle',
            melodyWave: 'sine'
        },
        adoracion: {
            chords: [
                [261.63, 329.63, 392.00, 523.25],
                [246.94, 293.66, 392.00, 493.88],
                [220.00, 261.63, 329.63, 440.00],
                [174.61, 220.00, 261.63, 349.23]
            ],
            melody: [
                523.25, 659.25, 783.99, 659.25, 587.33, 523.25,
                493.88, 587.33, 659.25, 587.33, 523.25, 440.00,
                523.25, 659.25, 783.99, 880.00, 783.99, 659.25,
                587.33, 523.25, 440.00, 392.00, 440.00, 523.25
            ],
            tempo: 4.5,
            waveform: 'sine',
            melodyWave: 'triangle'
        }
    };

    function init() {
        if (ctx) return;
        ctx = new (window.AudioContext || window.webkitAudioContext)();

        masterGain = ctx.createGain();
        masterGain.gain.value = 0.18;
        masterGain.connect(ctx.destination);

        const convolver = ctx.createConvolver();
        convolver.buffer = crearImpulsoReverb(ctx, 3.5, 2.5);

        reverbGain = ctx.createGain();
        reverbGain.gain.value = 0.45;

        reverbGain.connect(convolver);
        convolver.connect(masterGain);
    }

    function crearImpulsoReverb(ctx, duracion, decay) {
        const rate = ctx.sampleRate;
        const length = rate * duracion;
        const impulse = ctx.createBuffer(2, length, rate);
        for (let canal = 0; canal < 2; canal++) {
            const data = impulse.getChannelData(canal);
            for (let i = 0; i < length; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, decay);
            }
        }
        return impulse;
    }

    function playNote(freq, startTime, duration, waveform, gainValue) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = waveform;
        osc.frequency.value = freq;

        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(gainValue, startTime + duration * 0.2);
        gain.gain.linearRampToValueAtTime(gainValue * 0.6, startTime + duration * 0.5);
        gain.gain.linearRampToValueAtTime(0, startTime + duration);

        osc.connect(gain);
        gain.connect(masterGain);
        gain.connect(reverbGain);

        osc.start(startTime);
        osc.stop(startTime + duration);

        activeOscillators.push(osc);
        osc.onended = () => {
            const idx = activeOscillators.indexOf(osc);
            if (idx > -1) activeOscillators.splice(idx, 1);
        };
    }

    function programarCiclo() {
        if (!isPlaying || !currentProgression) return;

        const prog = PROGRESIONES[currentProgression];
        const now = ctx.currentTime + 0.1;
        const segPorAcorde = prog.tempo;

        prog.chords.forEach((chord, i) => {
            const startTime = now + i * segPorAcorde;
            chord.forEach((freq, j) => {
                const offset = j * 0.05;
                const ganancia = 0.12 / (j + 1);
                playNote(freq, startTime + offset, segPorAcorde * 1.1, prog.waveform, ganancia);
                playNote(freq * 2, startTime + offset + 0.02, segPorAcorde * 0.9, prog.waveform, ganancia * 0.35);
            });
        });

        const duracionMelodia = segPorAcorde / 2;
        prog.melody.forEach((freq, i) => {
            const startTime = now + i * duracionMelodia;
            playNote(freq, startTime, duracionMelodia * 1.4, prog.melodyWave, 0.09);
        });

        const duracionCiclo = prog.chords.length * segPorAcorde;
        loopTimer = setTimeout(() => {
            if (isPlaying) programarCiclo();
        }, duracionCiclo * 1000 - 100);
    }

    async function start(progression) {
        init();
        if (ctx.state === 'suspended') await ctx.resume();

        currentProgression = progression;
        if (isPlaying) return;

        isPlaying = true;
        masterGain.gain.cancelScheduledValues(ctx.currentTime);
        masterGain.gain.setValueAtTime(0, ctx.currentTime);
        masterGain.gain.linearRampToValueAtTime(0.18, ctx.currentTime + 2);

        programarCiclo();
    }

    function stop() {
        isPlaying = false;
        if (loopTimer) {
            clearTimeout(loopTimer);
            loopTimer = null;
        }
        if (ctx && masterGain) {
            masterGain.gain.cancelScheduledValues(ctx.currentTime);
            masterGain.gain.setValueAtTime(masterGain.gain.value, ctx.currentTime);
            masterGain.gain.linearRampToValueAtTime(0, ctx.currentTime + 1);
        }
        setTimeout(() => {
            activeOscillators.forEach(osc => {
                try { osc.stop(); } catch (e) {}
            });
            activeOscillators = [];
        }, 1100);
    }

    function changeProgression(progression) {
        if (currentProgression === progression) return;
        currentProgression = progression;
        if (isPlaying) {
            activeOscillators.forEach(osc => {
                try { osc.stop(); } catch (e) {}
            });
            activeOscillators = [];
            if (loopTimer) clearTimeout(loopTimer);
            programarCiclo();
        }
    }

    return { start, stop, changeProgression, isPlaying: () => isPlaying };
})();

// ============================================================
//  CONTROL DE MÚSICA
// ============================================================
async function activarMusica() {
    if (!sonidoActivo) return;

    if (modoMusica === 'url') {
        const url = selectorMusica.value;
        if (fuenteAudio.src !== url) {
            fuenteAudio.src = url;
            audioFondo.load();
        }
        audioFondo.currentTime = 0;
        audioFondo.volume = 0.35;
        const p = audioFondo.play();
        if (p !== undefined) p.catch(() => {});
    } else {
        audioFondo.pause();
        await MusicEngine.start(modoMusica);
    }
}

function desactivarMusica() {
    MusicEngine.stop();
    audioFondo.pause();
}

function toggleSonido() {
    sonidoActivo = !sonidoActivo;

    if (sonidoActivo) {
        btnSonido.textContent = '🔊';
        btnSonido.title = 'Desactivar música';
        btnSonido.classList.remove('silenciado');
        if (versiculoActual) activarMusica();
    } else {
        btnSonido.textContent = '🔇';
        btnSonido.title = 'Activar música';
        btnSonido.classList.add('silenciado');
        desactivarMusica();
    }
}

selectorMusica.addEventListener('change', async () => {
    const valor = selectorMusica.value;

    if (valor.startsWith('http')) {
        modoMusica = 'url';
    } else {
        modoMusica = valor;
        MusicEngine.stop();
        audioFondo.pause();
    }

    if (sonidoActivo && versiculoActual) {
        await activarMusica();
    }
});

// ============================================================
//  BUSCAR VERSÍCULO (local primero, API como respaldo)
// ============================================================
async function buscarVersiculo(libro, capitulo, versiculo) {
    // 1. Intentar base local
    const libroLocal = BIBLIA_LOCAL[libro];
    if (libroLocal && libroLocal[capitulo] && libroLocal[capitulo][versiculo]) {
        return {
            book: capitalizar(libro),
            chapter: Number(capitulo),
            verse: Number(versiculo),
            text: libroLocal[capitulo][versiculo],
            fuente: 'local'
        };
    }

    // 2. Si no está local, consultar API
    const url = `${API_BASE}/${VERSION}/${libro}/${capitulo}/${versiculo}`;
    const respuesta = await fetch(url);

    if (!respuesta.ok) {
        if (respuesta.status === 404) {
            throw new Error(`No se encontró ${libro} ${capitulo}:${versiculo}. Verifica los datos.`);
        } else {
            throw new Error(`Error en la consulta (código ${respuesta.status}).`);
        }
    }

    const datos = await respuesta.json();
    if (!datos.data || !datos.data.text) {
        throw new Error('La respuesta de la API no contiene el texto del versículo.');
    }

    return {
        book: datos.data.book,
        chapter: datos.data.chapter,
        verse: datos.data.verse,
        text: datos.data.text,
        fuente: 'api'
    };
}

// ============================================================
//  CONSULTAR VERSÍCULO
// ============================================================
async function consultarVersiculo() {
    const libro = selectorLibro.value;
    const capitulo = inputCapitulo.value.trim();
    const versiculo = inputVersiculo.value.trim();

    if (!capitulo || !versiculo) {
        mostrarError('Completa el capítulo y el versículo.');
        return;
    }

    const capNum = Number(capitulo);
    const verNum = Number(versiculo);
    if (!Number.isInteger(capNum) || !Number.isInteger(verNum) || capNum < 1 || verNum < 1) {
        mostrarError('El capítulo y el versículo deben ser números enteros positivos.');
        return;
    }

    mostrarCargando();
    btnCopiar.disabled = true;
    detenerLectura();

    try {
        const datos = await buscarVersiculo(libro, capNum, verNum);

        const ref = `${datos.book} ${datos.chapter}:${datos.verse}`;
        const textoLimpio = datos.text.replace(/\n+/g, ' ').trim();

        versiculoActual = { referencia: ref, texto: textoLimpio, fuente: datos.fuente };
        mostrarVersiculo(ref, textoLimpio, datos.fuente);
        agregarAlHistorial(ref, capNum, verNum, libro);
        activarMusica();

    } catch (error) {
        console.error(error);
        mostrarError(error.message || 'Error al consultar. Intenta de nuevo.');
        versiculoActual = null;
    }
}

// ============================================================
//  MOSTRAR ESTADOS
// ============================================================
function mostrarCargando() {
    resultadoDiv.className = 'resultado';
    referenciaDiv.textContent = '';
    textoVersiculoDiv.innerHTML = '<span class="spinner"></span> Consultando la Palabra...';
}

function mostrarVersiculo(referencia, texto, fuente) {
    resultadoDiv.className = 'resultado';
    referenciaDiv.textContent = referencia + (fuente === 'local' ? ' · local' : '');
    textoVersiculoDiv.innerHTML = `"${texto}" <span class="cita">— RVR1960</span>`;
    btnCopiar.disabled = false;
    btnLeer.disabled = false;
}

function mostrarError(mensaje) {
    resultadoDiv.className = 'resultado error';
    referenciaDiv.textContent = '';
    textoVersiculoDiv.innerHTML = `<span style="color:#b85c4a;">⚠️ ${mensaje}</span>`;
    btnCopiar.disabled = true;
    btnLeer.disabled = true;
}

function capitalizar(texto) {
    if (!texto) return '';
    return texto.charAt(0).toUpperCase() + texto.slice(1).toLowerCase();
}

// ============================================================
//  COPIAR VERSÍCULO
// ============================================================
btnCopiar.addEventListener('click', async () => {
    if (!versiculoActual) return;
    const textoCompleto = `"${versiculoActual.texto}" — ${versiculoActual.referencia} (RVR1960)`;

    try {
        await navigator.clipboard.writeText(textoCompleto);
        btnCopiar.textContent = '✅ Copiado';
        setTimeout(() => { btnCopiar.textContent = '📋 Copiar versículo'; }, 1800);
    } catch (err) {
        const textarea = document.createElement('textarea');
        textarea.value = textoCompleto;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        btnCopiar.textContent = '✅ Copiado';
        setTimeout(() => { btnCopiar.textContent = '📋 Copiar versículo'; }, 1800);
    }
});

// ============================================================
//  HISTORIAL
// ============================================================
function agregarAlHistorial(referencia, capitulo, versiculo, libro) {
    if (historial.length > 0 && historial[0].referencia === referencia) return;
    historial.unshift({ referencia, capitulo, versiculo, libro });
    if (historial.length > 8) historial.pop();
    renderizarHistorial();
}

function renderizarHistorial() {
    if (historial.length === 0) {
        historialLista.innerHTML = '<span class="historial-vacio">Aún no hay consultas.</span>';
        return;
    }

    historialLista.innerHTML = historial.map(item =>
        `<button class="historial-item" data-libro="${item.libro}" data-capitulo="${item.capitulo}" data-versiculo="${item.versiculo}">${item.referencia}</button>`
    ).join('');

    historialLista.querySelectorAll('.historial-item').forEach(btn => {
        btn.addEventListener('click', () => {
            selectorLibro.value = btn.dataset.libro;
            inputCapitulo.value = btn.dataset.capitulo;
            inputVersiculo.value = btn.dataset.versiculo;
            consultarVersiculo();
        });
    });
}

// ============================================================
//  EVENTOS
// ============================================================
btnConsultar.addEventListener('click', consultarVersiculo);
btnSonido.addEventListener('click', toggleSonido);

[inputCapitulo, inputVersiculo].forEach(input => {
    input.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); consultarVersiculo(); }
    });
});

audioFondo.load();

// Detener la voz si se cierra o recarga la página
window.addEventListener('beforeunload', () => {
    window.speechSynthesis.cancel();
});
</script>
